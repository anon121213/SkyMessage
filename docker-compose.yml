name: skymessage

# LOCAL DEVELOPMENT stack (Development environment, dev secrets allowed). Production uses a separate
# compose file with mandatory secrets and Caddy in front.
# Copy .env.example to .env and set LIVEKIT_NODE_IP to this machine's LAN IP so that emulators and
# phones on the same network can reach the call media ports.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skymessage
      POSTGRES_USER: skymessage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skymessage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skymessage -d skymessage"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.10
    # Fails fast without .env: a wrong node IP means "connected, no audio" on phones/emulators.
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP in .env to this machine's LAN IP}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-change-me-0123456789abcdef0123456789}"
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_API_KEY:-devkey}
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      # Webhooks reach the API both when it runs via `dotnet run` and as the compose `api` service.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Server/SkyMessage.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=skymessage;Username=skymessage;Password=${POSTGRES_PASSWORD:-skymessage}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Storage__MasterKey: ${STORAGE_MASTER_KEY:-ZGV2LW9ubHktbWFzdGVyLWtleS0zMi1ieXRlcyEhISE=}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY:-devkey}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET:-devsecret-change-me-0123456789abcdef0123456789}
      LiveKit__InternalUrl: "http://livekit:7880"
      LiveKit__PublicUrl: "/livekit"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: {}
