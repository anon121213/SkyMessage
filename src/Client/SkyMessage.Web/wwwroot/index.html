<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECE6FF" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SkyMessage" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SkyMessage</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
        /* First paint only; the UI stylesheet takes over (theme applied early by boot.js). */
        html, body { margin: 0; height: 100%; background: #ECE6FF; }
        @media (prefers-color-scheme: dark) { html, body { background: #150F38; } }
        #blazor-error-ui { display: none; }
    </style>
    <link rel="stylesheet" href="_content/SkyMessage.Client.UI/css/app.css" />
    <link rel="stylesheet" href="SkyMessage.Web.styles.css" />
    <script src="_content/SkyMessage.Client.UI/js/boot.js"></script>
    <script src="web-platform.js"></script>
</head>
<body>
    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        <span class="blazor-error-text"></span>
        <a href="" class="reload">⟳</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
