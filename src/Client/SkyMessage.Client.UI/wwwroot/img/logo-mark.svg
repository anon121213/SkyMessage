<?xml version="1.0" encoding="UTF-8"?>
<!-- SkyMessage mark: a warm sun behind a twilight-gradient cloud (our own artwork, same as Kit/Logo.razor Mark). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
  <defs>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#FFF6D2"/>
      <stop offset="0.45" stop-color="#FFCB6E"/>
      <stop offset="1" stop-color="#FF8A65"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#FFD58A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFD58A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4BFF"/>
      <stop offset="1" stop-color="#B04FE0"/>
    </linearGradient>
  </defs>
  <circle cx="292" cy="186" r="116" fill="url(#halo)"/>
  <circle cx="292" cy="186" r="72" fill="url(#sun)"/>
  <g fill="url(#cloud)">
    <circle cx="168" cy="268" r="62"/>
    <circle cx="238" cy="230" r="80"/>
    <circle cx="312" cy="280" r="54"/>
    <rect x="106" y="262" width="262" height="78" rx="39" ry="39"/>
  </g>
</svg>
