<?xml version="1.0" encoding="UTF-8"?>
<!-- SkyMessage app icon background: a twilight sky — deep indigo to violet to rose, a peach glow on the horizon
     (our own artwork; the same picture as Kit/Logo.razor). -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D2BD9"/>
      <stop offset="0.52" stop-color="#7B3FEA"/>
      <stop offset="1" stop-color="#D452A8"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.78" cy="1.02" r="0.72">
      <stop offset="0" stop-color="#FFB37A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFB37A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="0.22" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="456" height="456" fill="url(#sky)"/>
  <rect x="0" y="0" width="456" height="456" fill="url(#horizon)"/>
  <rect x="0" y="0" width="456" height="456" fill="url(#light)"/>
</svg>
