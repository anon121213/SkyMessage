# Every push and pull request: the server with the web client builds without warnings, all three test suites pass
# (the integration tests start PostgreSQL in Docker through Testcontainers) and the Android app compiles.
# Pushes to main run this through release.yml (workflow_call) before anything is released.
#
# Tests run with `dotnet test --project <dir> --no-build`: global.json selects Microsoft.Testing.Platform, whose
# `dotnet test` forwards options it does not know (-nologo, --artifacts-path, ...) to the test app, which then exits
# with code 5 and the run reports "Zero tests ran". Build first, pass nothing else.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  server:
    name: Server, web client and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-server-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'src/Server/**/*.csproj', 'src/Shared/**/*.csproj', 'src/Client/SkyMessage.Client.Core/*.csproj', 'src/Client/SkyMessage.Client.UI/*.csproj', 'src/Client/SkyMessage.Web/*.csproj', 'tests/**/*.csproj') }}
          restore-keys: nuget-server-${{ runner.os }}-

      - name: Install FFmpeg (the media tests run the real transcoding)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Build the server and the web client (warnings fail the build)
        run: dotnet build src/Server/SkyMessage.Api/SkyMessage.Api.csproj -c Release -warnaserror

      - name: Build the tests
        run: |
          for project in tests/SkyMessage.UnitTests tests/SkyMessage.Client.Core.Tests tests/SkyMessage.Api.IntegrationTests; do
            dotnet build "$project" -c Release -warnaserror
          done

      - name: Unit tests
        run: dotnet test --project tests/SkyMessage.UnitTests -c Release --no-build

      - name: Client core tests
        run: dotnet test --project tests/SkyMessage.Client.Core.Tests -c Release --no-build

      - name: Integration tests (PostgreSQL in Docker)
        run: dotnet test --project tests/SkyMessage.Api.IntegrationTests -c Release --no-build

  android:
    name: Android compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install the Android SDK packages the app needs
        run: >
          dotnet build src/Client/SkyMessage.App/SkyMessage.App.csproj -f net10.0-android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build the app
        run: >
          dotnet build src/Client/SkyMessage.App/SkyMessage.App.csproj -f net10.0-android -c Debug
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
